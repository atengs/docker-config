version: '3.9'

services:
  # PHP-FPM (dengan Composer dan extension Laravel-ready)
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-fpm
    restart: always
    volumes:
      - ./www:/var/www
      - ./config/php.ini:/usr/local/etc/php/conf.d/php.ini
    networks:
      chtzy-net:
        aliases:
          - php-fpm
        ipv4_address: 172.142.1.200

  # Nginx (1 config untuk 2 app)
  nginx:
    image: nginx:stable
    container_name: nginx
    restart: always
    depends_on:
      - php-fpm
    ports:
      - "8000:8000"
      - "8100:8100"
    volumes:
      - ./www:/var/www
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    networks:
      chtzy-net:
        aliases:
          - api
          - api-hq
        ipv4_address: 172.142.1.205

networks:
  chtzy-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.142.1.0/24
          gateway: 172.142.1.254
